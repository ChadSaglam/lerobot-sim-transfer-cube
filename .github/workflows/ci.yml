name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check scripts tests
      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Tests
        run: pytest -q
